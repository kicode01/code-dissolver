<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <style>
    .headline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
    .subtext { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 700; }
  </style>

  <rect width="860" height="440" rx="16" fill="url(#bg6)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Diagram Title -->
  <text x="40" y="44" class="headline">X-Raying Your Codebase (Deleting Fear-Driven Technical Debt)</text>
  <text x="40" y="64" class="subtext">How Code Dissolver correlates 90 days of production logs with code trees to safely excise dead functions.</text>

  <!-- Left: Live Active Code (Green) -->
  <g transform="translate(40, 95)">
    <rect width="260" height="270" rx="12" fill="#071a12" stroke="#059669" stroke-width="1.5"/>
    <rect x="16" y="16" width="130" height="20" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="24" y="30" class="badge" fill="#34d399">ACTIVE USER PATHS</text>

    <text x="16" y="65" class="mono" fill="#86efac">1,200,000 live calls</text>
    <text x="16" y="85" class="subtext">Real traffic from checkout &amp; login</text>

    <!-- Active boxes -->
    <rect x="16" y="110" width="228" height="55" rx="6" fill="#042f22"/>
    <text x="26" y="132" class="mono" fill="#6ee7b7">api_checkout_v2()</text>
    <text x="26" y="150" class="subtext">Active entry point</text>

    <rect x="16" y="175" width="228" height="55" rx="6" fill="#042f22"/>
    <text x="26" y="197" class="mono" fill="#6ee7b7">validate_cart()</text>
    <text x="26" y="215" class="subtext">Called by checkout (KEEP)</text>

    <text x="16" y="255" class="badge" fill="#34d399">[+] 100% Retained Safely</text>
  </g>

  <!-- Center: Dead Zombie Code (Grey/Red) -->
  <g transform="translate(320, 95)">
    <rect width="260" height="270" rx="12" fill="#181114" stroke="#991b1b" stroke-width="1.5"/>
    <rect x="16" y="16" width="130" height="20" rx="4" fill="#ef4444" opacity="0.2"/>
    <text x="24" y="30" class="badge" fill="#f87171">ZOMBIE GHOST PATHS</text>

    <text x="16" y="65" class="mono" fill="#fca5a5">0 calls in 90 days</text>
    <text x="16" y="85" class="subtext">Old experiments from 2021</text>

    <!-- Dead boxes -->
    <rect x="16" y="110" width="228" height="55" rx="6" fill="#2d1519"/>
    <text x="26" y="132" class="mono" fill="#fca5a5">legacy_tier3_rebate()</text>
    <text x="26" y="150" class="subtext">0 calls across 1.2M visits</text>

    <rect x="16" y="175" width="228" height="55" rx="6" fill="#2d1519"/>
    <text x="26" y="197" class="mono" fill="#fca5a5">unused_helper_math()</text>
    <text x="26" y="215" class="subtext">Dead dependency</text>

    <text x="16" y="255" class="badge" fill="#f87171">[x] Safe to Dissolve</text>
  </g>

  <!-- Right: Automated Vacuum Result -->
  <g transform="translate(600, 95)">
    <rect width="220" height="270" rx="12" fill="#081426" stroke="#0284c7" stroke-width="2"/>
    <rect x="16" y="16" width="130" height="20" rx="4" fill="#0284c7" opacity="0.2"/>
    <text x="24" y="30" class="badge" fill="#38bdf8">PRUNING RESULT</text>

    <text x="16" y="68" class="headline" font-size="14" fill="#38bdf8">Clean PR Generated</text>
    <text x="16" y="88" class="subtext">Zero broken imports.</text>

    <rect x="16" y="115" width="188" height="60" rx="6" fill="#0c1f2e"/>
    <text x="26" y="140" class="bignum" font-size="22" fill="#38bdf8">-120,000</text>
    <text x="26" y="160" class="subtext">Lines of bloat excised</text>

    <rect x="16" y="185" width="188" height="60" rx="6" fill="#052e16"/>
    <text x="26" y="210" class="mono" fill="#6ee7b7">0 Test Failures</text>
    <text x="26" y="230" class="subtext">100% Proven safe</text>
  </g>

  <!-- Bottom strip -->
  <rect x="40" y="390" width="780" height="34" rx="6" fill="#030712" stroke="#1f2937"/>
  <circle cx="58" cy="407" r="4" fill="#38bdf8"/>
  <text x="74" y="411" class="mono" fill="#94a3b8">Stop keeping dead code out of fear. Prove it has zero calls and prune it with confidence.</text>
</svg>
