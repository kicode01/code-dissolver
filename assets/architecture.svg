<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #f8fafc; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
    .tag { font-size: 10px; font-weight: 700; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>

  <rect width="860" height="420" rx="14" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Controls -->
  <circle cx="36" cy="36" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="54" cy="36" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="72" cy="36" r="6" fill="#10b981" opacity="0.8"/>
  <text x="100" y="41" class="mono" fill="#64748b">code-dissolver // Static AST &amp; Empirical Production Telemetry Matrix</text>

  <!-- Left: Static AST Graph -->
  <g transform="translate(40, 80)">
    <rect width="230" height="230" rx="8" fill="#111827" stroke="#374151"/>
    <rect x="14" y="14" width="105" height="20" rx="4" fill="#3b82f6" opacity="0.2"/>
    <text x="22" y="28" class="tag" fill="#60a5fa">STATIC AST GRAPH</text>

    <!-- Nodes -->
    <rect x="14" y="55" width="160" height="30" rx="4" fill="#1f2937"/>
    <text x="22" y="74" class="mono" fill="#e5e7eb">api_checkout_v2()</text>

    <rect x="14" y="95" width="160" height="30" rx="4" fill="#1f2937"/>
    <text x="22" y="114" class="mono" fill="#e5e7eb">validate_cart()</text>

    <rect x="14" y="135" width="190" height="30" rx="4" fill="#2e1a1e" stroke="#ef4444"/>
    <text x="22" y="154" class="mono" fill="#fca5a5">legacy_tier3_rebate()</text>

    <rect x="14" y="175" width="190" height="30" rx="4" fill="#2e1a1e" stroke="#ef4444"/>
    <text x="22" y="194" class="mono" fill="#fca5a5">unused_helper_math()</text>
  </g>

  <!-- Plus -->
  <text x="290" y="205" font-family="sans-serif" font-size="28" fill="#64748b">+</text>

  <!-- Middle: Production eBPF/APM Telemetry -->
  <g transform="translate(330, 80)">
    <rect width="230" height="230" rx="8" fill="#111827" stroke="#374151"/>
    <rect x="14" y="14" width="135" height="20" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="22" y="28" class="tag" fill="#34d399">90-DAY TELEMETRY</text>

    <!-- Telemetry counts -->
    <rect x="14" y="55" width="190" height="30" rx="4" fill="#064e3b"/>
    <text x="22" y="74" class="mono" fill="#6ee7b7">1,200,000 invocations</text>

    <rect x="14" y="95" width="190" height="30" rx="4" fill="#064e3b"/>
    <text x="22" y="114" class="mono" fill="#6ee7b7">1,200,000 invocations</text>

    <rect x="14" y="135" width="190" height="30" rx="4" fill="#3b0f15"/>
    <text x="22" y="154" class="mono" fill="#fda4af">0 invocations (Ghost!)</text>

    <rect x="14" y="175" width="190" height="30" rx="4" fill="#3b0f15"/>
    <text x="22" y="194" class="mono" fill="#fda4af">0 invocations (Ghost!)</text>
  </g>

  <!-- Equals -->
  <text x="580" y="205" font-family="sans-serif" font-size="28" fill="#64748b">=</text>

  <!-- Right: Cleaned Codebase Output -->
  <g transform="translate(620, 80)">
    <rect width="200" height="230" rx="8" fill="#0c172a" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect x="14" y="14" width="125" height="20" rx="4" fill="#0284c7" opacity="0.2"/>
    <text x="22" y="28" class="tag" fill="#38bdf8">PRUNING RESULT</text>

    <rect x="14" y="60" width="170" height="40" rx="6" fill="#1e1b2e" stroke="#f43f5e"/>
    <text x="22" y="80" class="tag" fill="#f87171">SAFE TO EXCISE</text>
    <text x="22" y="94" class="mono" fill="#fda4af">2 Dead Functions</text>

    <rect x="14" y="115" width="170" height="40" rx="6" fill="#0d2818" stroke="#10b981"/>
    <text x="22" y="135" class="tag" fill="#34d399">SAFETY SCORE</text>
    <text x="22" y="149" class="mono" fill="#6ee7b7">100% Zero Drift</text>

    <text x="14" y="185" class="mono" fill="#94a3b8">- Zero test regressions</text>
    <text x="14" y="205" class="mono" fill="#94a3b8">- Shrinks repo size</text>
  </g>

  <!-- Bottom banner -->
  <rect x="40" y="340" width="780" height="45" rx="6" fill="#0b1120" stroke="#1e293b"/>
  <circle cx="58" cy="362" r="4" fill="#10b981"/>
  <text x="74" y="366" class="mono" fill="#cbd5e1">Transitive Reachability Proof: Function not referenced in public contracts or active call chains</text>
</svg>
